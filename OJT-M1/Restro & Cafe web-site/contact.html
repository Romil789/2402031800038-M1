<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RD's Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <div class="logo">RD's Cafe<span>.</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact Us</a>
            <button id="cartBtn"><i class="fa-solid fa-cart-shopping"></i><span id="cartCount">0</span></button>
            <button id="darkModeBtn"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-container">
            <div class="section-title">
                <h2>Contact Us</h2>
                <p>We'd love to hear from you! Send us your questions or feedback.</p>
            </div>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message"></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>

            <div id="error"></div>
            <div id="success"></div>

            <div class="contact-info">
                <h3>RD's Cafe</h3>
                <p>📍 RD's Cafe & Restro, Ahmedabad</p>
                <p>📞 +91 9835701357</p>
                <p>✉️ rdscafeandrestro@gmail.com</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 RD's Cafe | Designed with HTML, CSS & JavaScript</p>
    </footer>
</body>
</html>
