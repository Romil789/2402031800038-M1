<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function foo (p1)
    {
        if(typeof(p1) == "number")
            return 0;
        else
        if(typeof(p1) == "string")
            return "zero";
    }
    foo(1);
    foo("abc");
    foo();
    
    document.write(foo(1));
    document.write("<br>");
    document.write(foo("abc"));
    document.write("<br>");
    document.write(foo());
    document.write("<br>");

    </script>
    
</body>
</html>
