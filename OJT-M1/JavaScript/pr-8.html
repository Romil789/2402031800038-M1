<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var A = prompt("Enter a number:");
        document.write(A);
        if (A >= 0){
            document.write("<br> Yor Number is Positive.");
        }
        else{
            document.write("Your Number is Negative.");
        }
    </script>
</body>
</html>
