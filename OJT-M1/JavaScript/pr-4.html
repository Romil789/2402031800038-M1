<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Variables</h2>
    <p>
        in this example,x,y,z are variables.
    </p>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        var x = 5;
        var y = 6;
        var z = x + y;
        var o = x - y;
        var p = x * y;
        var q = x / y;
        document.getElementById("demo").innerHTML = "value of z is:" + z;
        document.getElementById("demo1").innerHTML = "value of o is:" + o;
        document.getElementById("demo2").innerHTML = "value of p is:" + p;
        document.getElementById("demo3").innerHTML = "value of q is:" + q;
        
    </script>
</body>
</html>
