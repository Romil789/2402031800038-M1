<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        num1 = prompt("Enter a 1st Number:");
        num2 = prompt("Enter a 2nd Number");

        if(num2 !== 0){
            document.write("You Division is:" + (num1/num2));
        }else
        {
            document.write("Invalid Input!");
        }
    </script>
</body>
</html>
