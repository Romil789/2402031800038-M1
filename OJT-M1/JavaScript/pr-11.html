<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Display Student Name</h1>
    <script>
        var arr = [i];
        for(var i = 0;i < 5; i++){
        arr[i] = prompt("Enter Student Name:" );
        document.write((i+1) + ":" + arr[i]);
        document.write("<br>");
        }
    </script>
</body>
</html>
