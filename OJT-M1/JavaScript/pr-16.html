<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var A = " Dev ";
        var B = "Gediya";
        var C = " Dev Gediya "
        document.write(A.charAt(1));
        document.write("<br>");

        document.write(A.concat(B));
        document.write("<br>");

        document.write(A.indexOf("e"));
        document.write("<br>");
        
        document.write(B.lastIndexOf("a"));
        document.write("<br>");

        document.write(A.replace("v","x"));
        document.write("<br>");

        document.write(A.split("D"));
        document.write("<br>");

        document.write(C.trim());
        document.write("<br>");



    </script>
</body>
</html>
