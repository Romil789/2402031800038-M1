<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        let x = 5;
        x++;
        var y = 6;
        y--;
        var z = 4;
        ++z;
        var a = 8;
        --a;
    
        document.write("Post Increment:" + x);
        document.write("<br> post increment is:" + y);
        document.write("<br> post decrement is:" + z);
        document.write("<br> post decrement is:" + a);
        document.write("<br>");
        document.write(a == y);
        document.write("<br>");
        document.write(a != z);
        document.write("<br>");
        document.write(a === a);
        document.write("<br>");
        document.write(a !== y);
        document.write("<br>");
        document.write(a < y);
        document.write("<br>");
        document.write(a > z);
        document.write("<br>");
        document.write(a <= a);
        document.write("<br>");
        document.write(a >= z);

    </script>
</body>
</html>
