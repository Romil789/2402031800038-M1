<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        var A = prompt("Enter your Age:");
        document.write("<br>");
        document.write("Your age is:" + A);
        if (A >= 18){
            document.write("<br> Eligible for voting.")
        }
        else{
            document.write("You are Not Eligible for voting!..")
        }
    </script>
</body>
</html>
