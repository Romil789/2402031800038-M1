<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="2" align="center" style="background-color: lightgrey">
        <tr align="center">
            <td colspan="8"><h2>Registration Form</h2></td>
        </tr>
        <tr align="center">
            <td colspan="3">First Name:</td>
            <td colspan="5"><input type="text" placeholder="Enter Your First Name"></td>
        </tr>
        <tr align="center">
            <td colspan="3">Last Name:</td>
            <td colspan="5"><input type="text" placeholder="Eneter Your Last Name"></td>
        </tr>
        <tr align="center">
            <td colspan="3">Email:</td>
            <td colspan="5"><input type="text" placeholder="Enter Your Email"></td>
        </tr>
        <tr align="center">
            <td colspan="3">Password:</td>
            <td colspan="5"><input type="password" placeholder="Enter Your password"></td>
        </tr>
        <tr align="center">
            <td colspan="3">Gender:</td>
            <td colspan="5">
                <input type="radio" name="gender" value="Male">Male
                <input type="radio" name="gender" value="Female">Female
            </td>
        </tr>
        <tr align="center">
            <td colspan="3">Hobby:</td>
            <td colspan="5">
                <input type="radio" name="hobby" value="playing">playing
                <input type="radio" name="hobby" value="Travelling">Travelling
                <input type="radio" name="hobby" value="cooking">cookoing
            </td>
        </tr>
        <tr align="center">
            <td colspan="3">Country:</td>
            <td colspan="5">
                <select>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="Canada">Canada</option>
                    <option value="Thailand">Thailand</option>
                </select>
            </td>
        </tr>
        <tr align="center">
            <td colspan="3">Contact:</td>
            <td colspan="5"><input type="tel" placeholder="Enter Your Contact Number"></td>
        </tr>
        <tr align="center">
            <td colspan="3">Date of Birth:</td>
            <td colspan="5"><input type="date"></td>
        </tr>
        <tr align="center">
            <td colspan="3"></td>
            <td colspan="3"><input type="submit" value="submit" name="submit"></td>
            &nbsp;
            <td colspan="2"><input type="reset" value="reset"></td>
        </tr>
    </table>
</body>
</html>
