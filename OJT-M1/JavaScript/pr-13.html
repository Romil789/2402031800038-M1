<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Generate Multiplication Table</h2>
    <script>
        var n = prompt("Enter A Number to Generate its Multiplication Table:");
        document.write("Multiplication Table Of number - " + n);
        document.write("<br>");
        for(var i = 1; i<=10; i++){
            document.write(n + " x " + i + " = " + (n * i) );
            document.write("<br>");
        }
    </script>
</body>
</html>
